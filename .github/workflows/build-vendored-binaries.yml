name: Build vendored binaries (all platforms)

# Builds native rhwp release binaries for all 4 platforms hwpx-template-engine
# vendors (vendor/rhwp/<platform>/). linux-x86_64, windows-x86_64, and
# macos-aarch64 build natively on their own runner architecture.
# macos-x86_64 is cross-compiled *from* the macos-14 (Apple Silicon) runner
# instead of running on a native macos-13 (Intel) runner — GitHub's Intel
# macOS runner pool has very limited/no capacity (a real run of this workflow
# saw the macos-13 job queue for 28+ minutes with zero runner assigned while
# every other job started within seconds), so relying on it is not viable.
# Cross-compiling avoids that entirely; see PATCHES.md in the consuming repo
# (hwpx-template-engine/vendor/rhwp/PATCHES.md) for the toolchain-vs-PATH
# gotcha this ran into when done locally with a non-rustup rustc on PATH
# (not applicable here since GitHub's macOS runners only have the
# rustup-managed toolchain).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build (defaults to whichever ref triggered this run)"
        required: false
        type: string
  push:
    branches:
      - "patch/**"

jobs:
  build:
    name: ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: macos-aarch64
            binary_name: rhwp
            native: true
          - os: macos-14
            target: x86_64-apple-darwin
            artifact_name: macos-x86_64
            binary_name: rhwp
            native: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: linux-x86_64
            binary_name: rhwp
            native: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: windows-x86_64
            binary_name: rhwp.exe
            native: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Rust target (rust-toolchain.toml pins the channel)
        run: rustup target add ${{ matrix.target }}
        shell: bash

      - name: Cache cargo registry + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-

      - name: Run test suite (native targets only; cross-compiled test binaries can't execute on the build host)
        if: matrix.native
        run: cargo test --profile release-test --tests
        shell: bash

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
        shell: bash

      - name: Stage binary for upload
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.artifact_name }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" \
             "dist/${{ matrix.artifact_name }}/${{ matrix.binary_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rhwp-${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}/${{ matrix.binary_name }}
          if-no-files-found: error
