name: CI

on:
  push:
    branches: [main, devel]
    tags: ['v*']
    paths-ignore:
      - 'mydocs/**'
      - 'docs/**'
      - 'samples/**'
      - 'assets/chrome/**'
      - 'assets/edge/**'
      - 'assets/logo/**'
      - 'assets/screenshots/**'
      - '*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/CODE_OF_CONDUCT.md'
      - '.github/SECURITY.md'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - 'rhwp-logo.*'
  pull_request:
    branches: [main, devel]
    paths-ignore:
      - 'docs/**'
      - 'samples/**'
      - 'assets/chrome/**'
      - 'assets/edge/**'
      - 'assets/logo/**'
      - 'assets/screenshots/**'
      - '*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/CODE_OF_CONDUCT.md'
      - '.github/SECURITY.md'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - 'rhwp-logo.*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# [Task #1192 F] 같은 PR 에 새 push 가 오면 진행 중 run 을 취소해 중복 실행 제거.
# cancel-in-progress 는 PR 이벤트에서만 활성화 — devel/main push 머지 검증 run 은 보존.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: CI preflight
    runs-on: ubuntu-latest
    # [#3284] 러너 hang 을 실패로 드러내는 상한 (성능 목표 아님) — 실험 종료 후에도 유지
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      checks: read
      pull-requests: read
    outputs:
      fast_pass: ${{ steps.detect.outputs.fast_pass || 'false' }}
      reason: ${{ steps.detect.outputs.reason || 'preflight-unavailable' }}
      candidate_sha: ${{ steps.detect.outputs.candidate_sha || '' }}
      frontend_required: ${{ steps.frontend-impact.outputs.frontend_required || 'true' }}
      frontend_reason: ${{ steps.frontend-impact.outputs.frontend_reason || 'frontend-detection-unavailable' }}
      # [#3790 Stage 1] shadow output은 관찰 전용이다. 아래 worker 조건은 아직 이 값을 참조하지 않는다.
      shadow_rust_required: ${{ steps.impact-shadow.outputs.rust_required || 'true' }}
      shadow_frontend_mode: ${{ steps.impact-shadow.outputs.frontend_mode || 'package' }}
      shadow_render_required: ${{ steps.impact-shadow.outputs.render_required || 'true' }}
      shadow_native_skia_required: ${{ steps.impact-shadow.outputs.native_skia_required || 'true' }}
      shadow_codeql_languages: ${{ steps.impact-shadow.outputs.codeql_languages || 'javascript-typescript,python,rust' }}
      shadow_classification_status: ${{ steps.impact-shadow.outputs.classification_status || 'full' }}
      shadow_classifier_version: ${{ steps.impact-shadow.outputs.classifier_version || 'unavailable' }}
      shadow_reason: ${{ steps.impact-shadow.outputs.reason || 'fail-closed:shadow-unavailable' }}
      shadow_authority: ${{ steps.collect-impact-shadow.outputs.authority || 'unavailable-advisory' }}

    steps:
      - name: Detect review-only fast pass
        id: detect
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # [#2804] API 5xx 일시 오류에 job 이 죽지 않도록 재시도한다.
          # retry-exempt-status-codes 기본값(400,401,403,404,422)이 4xx 를 제외하므로 5xx 만 재시도된다.
          retries: 3
          script: |
            const allowedConclusions = new Set(['success', 'skipped', 'neutral']);
            const { owner, repo } = context.repo;

            function setResult(fastPass, reason, candidateSha = '') {
              core.setOutput('fast_pass', fastPass ? 'true' : 'false');
              core.setOutput('reason', reason);
              core.setOutput('candidate_sha', candidateSha);
              core.info(`fast_pass=${fastPass} reason=${reason} candidate_sha=${candidateSha}`);
            }

            function isAllowedReviewPath(file) {
              const filename = file.filename;
              if (filename.startsWith('mydocs/')) {
                return true;
              }
              if (file.status !== 'added') {
                return false;
              }
              return isReviewReferencePath(filename);
            }

            function isReviewReferencePath(filename) {
              return (
                filename.startsWith('samples/')
                && (
                  filename.endsWith('.hwp')
                  || filename.endsWith('.hwpx')
                  || filename.endsWith('.pdf')
                  || filename.endsWith('.png')
                )
              ) || (filename.startsWith('pdf/') && filename.endsWith('.pdf'));
            }

            function reviewOnlyLabel(files) {
              const hasReferenceArtifact = files.some((file) => (
                file.status === 'added'
                && isReviewReferencePath(file.filename)
              ));
              return hasReferenceArtifact ? 'review-reference-only' : 'mydocs-only';
            }

            function isCurrentBaseReviewMerge(commit, baseSha) {
              const parents = commit.parents || [];
              return parents.length === 2 && parents.some((parent) => parent.sha === baseSha);
            }

            async function isCurrentBaseAncestor(candidateSha, baseSha) {
              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${baseSha}...${candidateSha}`,
              });
              return comparison.status === 'ahead' || comparison.status === 'identical';
            }

            function latestRun(runs) {
              return runs
                .slice()
                .sort((a, b) => {
                  const bTime = Date.parse(b.completed_at || b.started_at || b.created_at || 0);
                  const aTime = Date.parse(a.completed_at || a.started_at || a.created_at || 0);
                  return bTime - aTime;
                })[0];
            }

            async function buildResult(candidateSha, pr) {
              const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref: candidateSha,
                per_page: 100,
              });
              let source = 'check-run';
              let buildRun = latestRun(checkRuns.filter((run) => (
                run.name === 'Build & Test'
                && run.app?.slug === 'github-actions'
              )));

              if (!buildRun) {
                // Fork PRs can expose the aggregate only through Actions jobs. Keep the
                // branch and exact candidate SHA identity guard for that fallback.
                const workflowRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner,
                  repo,
                  workflow_id: 'ci.yml',
                  event: 'pull_request',
                  branch: pr.head.ref,
                  per_page: 100,
                });
                const workflowRun = latestRun(workflowRuns.filter((run) => (
                  run.path === '.github/workflows/ci.yml'
                  && run.event === 'pull_request'
                  && run.head_sha === candidateSha
                )));

                if (!workflowRun) {
                  return { state: 'missing', reason: `missing-build-and-test:${candidateSha}` };
                }
                if (workflowRun.status !== 'completed') {
                  return {
                    state: 'pending',
                    reason: `build-and-test-workflow-not-completed:${workflowRun.status}`,
                  };
                }

                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  owner,
                  repo,
                  run_id: workflowRun.id,
                  filter: 'latest',
                  per_page: 100,
                });
                buildRun = latestRun(jobs.filter((job) => job.name === 'Build & Test'));
                if (!buildRun) {
                  return { state: 'missing', reason: `missing-build-and-test-job:${candidateSha}` };
                }
                source = 'actions-job';
              }
              if (buildRun.status !== 'completed') {
                return {
                  state: 'pending',
                  reason: `build-and-test-not-completed:${buildRun.status}`,
                };
              }
              if (!allowedConclusions.has(buildRun.conclusion)) {
                return {
                  state: 'failed',
                  reason: `build-and-test-not-green:${buildRun.conclusion}`,
                };
              }
              return { state: 'green', source, conclusion: buildRun.conclusion };
            }

            try {
              if (context.eventName !== 'pull_request') {
                setResult(false, 'not-pull-request');
                return;
              }

              const pr = context.payload.pull_request;
              const prFiles = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              });
              if (prFiles.length > 0 && prFiles.every((file) => isAllowedReviewPath(file))) {
                core.info(`all PR files are review-only; using base SHA ${pr.base.sha}`);
                setResult(true, 'all-review-only-no-code-impact', pr.base.sha);
                return;
              }

              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              });

              if (commits.length === 0) {
                setResult(false, 'no-pr-commits');
                return;
              }

              const reviewOnlyCandidates = [];
              let codeCandidateSha = '';

              for (let index = commits.length - 1; index >= 0; index -= 1) {
                const sha = commits[index].sha;
                const { data: commit } = await github.rest.repos.getCommit({
                  owner,
                  repo,
                  ref: sha,
                });
                const files = commit.files || [];

                // The commit endpoint may truncate very large file lists. Fall back to full CI.
                if (files.length === 0 || files.length >= 300) {
                  setResult(false, `unusable-file-list:${sha}`);
                  return;
                }

                const reviewOnly = files.every((file) => isAllowedReviewPath(file));
                if (reviewOnly) {
                  const parents = commit.parents || [];
                  if (parents.length === 1) {
                    reviewOnlyCandidates.push(sha);
                    continue;
                  }
                  // #3233: a docs-only Update branch merge can be an eligible green
                  // candidate only after a trailing review-only record. Other merge
                  // shapes may hide code outside the review-only diff.
                  if (reviewOnlyCandidates.length > 0
                    && isCurrentBaseReviewMerge(commit, pr.base.sha)) {
                    reviewOnlyCandidates.push(sha);
                    core.info(`including current-base ${reviewOnlyLabel(files)} merge candidate ${sha}`);
                    break;
                  }
                  setResult(false, `${reviewOnlyLabel(files)}-merge-not-reusable:${sha}`);
                  return;
                }

                codeCandidateSha = sha;
                break;
              }

              if (reviewOnlyCandidates.length === 0) {
                setResult(false, 'no-trailing-review-only-commits');
                return;
              }
              if (codeCandidateSha) {
                reviewOnlyCandidates.push(codeCandidateSha);
              }

              for (const candidateSha of reviewOnlyCandidates) {
                if (!(await isCurrentBaseAncestor(candidateSha, pr.base.sha))) {
                  core.info(`candidate does not include current base: ${candidateSha}`);
                  continue;
                }
                const result = await buildResult(candidateSha, pr);
                if (result.state === 'green') {
                  const successReason = result.source === 'check-run'
                    ? `build-and-test-green:${result.conclusion}`
                    : `build-and-test-job-green:${result.conclusion}`;
                  setResult(true, successReason, candidateSha);
                  return;
                }
                if (result.state === 'failed') {
                  setResult(false, result.reason, candidateSha);
                  return;
                }
                core.info(`candidate not reusable yet: ${candidateSha} (${result.reason})`);
              }

              setResult(false, 'no-green-current-base-build-candidate');
            } catch (error) {
              core.warning(`CI preflight failed; running full CI. ${error.message}`);
              setResult(false, 'preflight-error');
            }

      - name: Detect frontend impact
        id: frontend-impact
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # [#2804] API 5xx 일시 오류에 job 이 죽지 않도록 재시도한다.
          # retry-exempt-status-codes 기본값(400,401,403,404,422)이 4xx 를 제외하므로 5xx 만 재시도된다.
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const directoryPrefixes = [
              'rhwp-studio/',
              'rhwp-chrome/',
              'rhwp-firefox/',
              'rhwp-safari/',
              'rhwp-vscode/',
              'rhwp-shared/',
              'npm/editor/',
              'assets/fonts/',
            ];

            function setResult(required, reason) {
              core.setOutput('frontend_required', required ? 'true' : 'false');
              core.setOutput('frontend_reason', reason);
              core.info(`frontend_required=${required} frontend_reason=${reason}`);
            }

            function isFrontendPath(filename) {
              if (directoryPrefixes.some((prefix) => filename.startsWith(prefix))) {
                return true;
              }
              if (
                filename === 'Cargo.lock'
                || filename === 'src/wasm_api.rs'
                || filename === '.github/workflows/ci.yml'
              ) {
                return true;
              }
              return filename.startsWith('scripts/frontend-') && filename.endsWith('.mjs');
            }

            function evaluateFiles(files) {
              for (const file of files) {
                for (const filename of [file.filename, file.previous_filename]) {
                  if (filename && isFrontendPath(filename)) {
                    setResult(true, `frontend-path:${filename}`);
                    return;
                  }
                }
              }
              setResult(false, 'no-frontend-path');
            }

            try {
              if (context.eventName === 'pull_request') {
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  owner,
                  repo,
                  pull_number: context.payload.pull_request.number,
                  per_page: 100,
                });
                // The API documents at most 3,000 PR files. Treat the boundary as truncated.
                if (files.length === 0 || files.length >= 3000) {
                  setResult(true, 'pr-file-list-empty-or-unusable');
                  return;
                }
                evaluateFiles(files);
                return;
              }

              if (context.eventName === 'push') {
                if (context.ref.startsWith('refs/tags/')) {
                  setResult(true, 'manual-or-tag');
                  return;
                }

                const before = context.payload.before || '';
                const after = context.payload.after || context.sha;
                if (!before || /^0+$/.test(before)) {
                  setResult(true, 'push-zero-before');
                  return;
                }

                const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${before}...${after}`,
                });
                const files = comparison.files || [];
                // Compare exposes at most 300 files. The boundary may be truncated.
                if (files.length === 0 || files.length >= 300) {
                  setResult(true, 'push-file-list-empty-or-unusable');
                  return;
                }
                evaluateFiles(files);
                return;
              }

              if (context.eventName === 'workflow_dispatch') {
                setResult(true, 'manual-or-tag');
                return;
              }

              setResult(true, `unsupported-event:${context.eventName}`);
            } catch (error) {
              core.warning(`Frontend impact detection failed; running frontend gates. ${error.message}`);
              setResult(true, 'detection-error');
            }

      # [#3790 Stage 2.5] PR의 classifier 구현은 PR head가 아닌 base SHA에 고정한다.
      # 아직 worker skip에는 사용하지 않으며 토큰 없는 별도 node step에서 shadow 판정만 기록한다.
      - name: Check out trusted CI impact classifier
        id: checkout-impact-classifier
        if: ${{ steps.detect.outputs.fast_pass != 'true' }}
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci-impact-classifier.cjs
          sparse-checkout-cone-mode: false

      - name: Collect shadow CI impact input
        id: collect-impact-shadow
        if: ${{ steps.detect.outputs.fast_pass != 'true' }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CLASSIFIER_CHECKOUT_OUTCOME: ${{ steps.checkout-impact-classifier.outcome }}
        with:
          retries: 3
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { owner, repo } = context.repo;
            const inputPath = path.join(
              process.env.GITHUB_WORKSPACE || process.cwd(),
              '.ci-impact-input.json',
            );
            const checkoutSucceeded = process.env.CLASSIFIER_CHECKOUT_OUTCOME === 'success';
            const authority = !checkoutSucceeded
              ? 'unavailable-advisory'
              : context.eventName === 'pull_request'
                ? 'pr-base-trusted-shadow'
                : 'checked-out-ref-advisory';
            core.setOutput('authority', authority);

            function writeInput(input) {
              fs.writeFileSync(inputPath, `${JSON.stringify(input)}\n`, 'utf8');
              core.info(`shadow impact input: event=${input.eventName} files=${input.files.length}`);
            }

            function normalizedFiles(files) {
              return files.map((file) => ({
                filename: file.filename,
                previous_filename: file.previous_filename || '',
                status: file.status || 'modified',
              }));
            }

            try {
              if (context.eventName === 'pull_request') {
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  owner,
                  repo,
                  pull_number: context.payload.pull_request.number,
                  per_page: 100,
                });
                writeInput({
                  eventName: context.eventName,
                  files: normalizedFiles(files),
                });
                return;
              }

              if (context.eventName === 'push') {
                if (context.ref.startsWith('refs/tags/')) {
                  writeInput({
                    eventName: context.eventName,
                    files: [],
                    forceFullReason: 'manual-or-tag',
                  });
                  return;
                }

                const before = context.payload.before || '';
                const after = context.payload.after || context.sha;
                if (!before || /^0+$/.test(before)) {
                  writeInput({
                    eventName: context.eventName,
                    files: [],
                    forceFullReason: 'push-zero-before',
                  });
                  return;
                }

                const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${before}...${after}`,
                });
                writeInput({
                  eventName: context.eventName,
                  files: normalizedFiles(comparison.files || []),
                });
                return;
              }

              writeInput({
                eventName: context.eventName,
                files: [],
                forceFullReason: context.eventName === 'workflow_dispatch'
                  ? 'manual-or-tag'
                  : 'unsupported-event',
              });
            } catch (error) {
              core.warning(`Shadow impact file collection failed; recording full. ${error.message}`);
              writeInput({
                eventName: context.eventName,
                files: [],
                forceFullReason: 'collection-error',
              });
            }

      - name: Classify CI impact in shadow mode
        id: impact-shadow
        if: ${{ steps.detect.outputs.fast_pass != 'true' }}
        continue-on-error: true
        run: >-
          node scripts/ci-impact-classifier.cjs
          --input .ci-impact-input.json
          --github-output "$GITHUB_OUTPUT"

      - name: Summarize shadow CI impact classification
        if: ${{ always() }}
        continue-on-error: true
        env:
          SHADOW_AUTHORITY: ${{ steps.collect-impact-shadow.outputs.authority || 'unavailable-advisory' }}
          SHADOW_RUST_REQUIRED: ${{ steps.impact-shadow.outputs.rust_required || 'true' }}
          SHADOW_FRONTEND_MODE: ${{ steps.impact-shadow.outputs.frontend_mode || 'package' }}
          SHADOW_RENDER_REQUIRED: ${{ steps.impact-shadow.outputs.render_required || 'true' }}
          SHADOW_NATIVE_SKIA_REQUIRED: ${{ steps.impact-shadow.outputs.native_skia_required || 'true' }}
          SHADOW_CODEQL_LANGUAGES: ${{ steps.impact-shadow.outputs.codeql_languages || 'javascript-typescript,python,rust' }}
          SHADOW_STATUS: ${{ steps.impact-shadow.outputs.classification_status || 'full' }}
          SHADOW_VERSION: ${{ steps.impact-shadow.outputs.classifier_version || 'unavailable' }}
          SHADOW_REASON: ${{ steps.impact-shadow.outputs.reason || 'fail-closed:shadow-unavailable' }}
        run: |
          {
            echo '### Shadow CI impact classification'
            echo
            echo '> Advisory only: existing worker conditions are unchanged in #3790 Stage 2.5.'
            echo '> Pull requests classify with the base SHA classifier; review-only fast-pass skips its checkout.'
            echo
            echo '| Axis | Value |'
            echo '| --- | --- |'
            printf '| authority | %s |\n' "${SHADOW_AUTHORITY}"
            printf '| rust_required | %s |\n' "${SHADOW_RUST_REQUIRED}"
            printf '| frontend_mode | %s |\n' "${SHADOW_FRONTEND_MODE}"
            printf '| render_required | %s |\n' "${SHADOW_RENDER_REQUIRED}"
            printf '| native_skia_required | %s |\n' "${SHADOW_NATIVE_SKIA_REQUIRED}"
            printf '| codeql_languages | %s |\n' "${SHADOW_CODEQL_LANGUAGES}"
            printf '| classification_status | %s |\n' "${SHADOW_STATUS}"
            printf '| classifier_version | %s |\n' "${SHADOW_VERSION}"
            printf '| reason | %s |\n' "${SHADOW_REASON}"
          } >> "${GITHUB_STEP_SUMMARY}"

  # [#2393] 기본 테스트 병렬화 — CI impact shadow 검증이 preflight와 worker 조건을 나누는 경계다.
  # [#3888] slow builder는 archive 2를 함께 만들어 runner 네 개 안에서 compile 부하를 균형화한다.
  # regular target은 archive 1/2/3에 직접 배정하고, 네 worker는 정확히 자기 archive 하나만 내려받는다.
  # required check 는 집계 job "Build & Test" 로 불변이다.
  build-test-archive-slow:
    uses: ./.github/workflows/build-nextest-archives.yml
    needs: [preflight, lint, frontend-package-gates]
    if: >-
      ${{
        always()
        && needs.preflight.result == 'success'
        && needs.preflight.outputs.fast_pass != 'true'
        && needs.lint.result == 'success'
        && (
          needs['frontend-package-gates'].result == 'success'
          || (
            needs.preflight.outputs.frontend_required != 'true'
            && needs['frontend-package-gates'].result == 'skipped'
          )
        )
      }}
    permissions:
      contents: read
    with:
      builder: slow
      archive_labels: "slow 2"
      expected_count_suffix: slow

  build-test-archive-a:
    uses: ./.github/workflows/build-nextest-archives.yml
    needs: [preflight, lint, frontend-package-gates]
    if: >-
      ${{
        always()
        && needs.preflight.result == 'success'
        && needs.preflight.outputs.fast_pass != 'true'
        && needs.lint.result == 'success'
        && (
          needs['frontend-package-gates'].result == 'success'
          || (
            needs.preflight.outputs.frontend_required != 'true'
            && needs['frontend-package-gates'].result == 'skipped'
          )
        )
      }}
    permissions:
      contents: read
    with:
      builder: a
      archive_labels: "1"
      expected_count_suffix: a

  build-test-archive-b:
    uses: ./.github/workflows/build-nextest-archives.yml
    needs: [preflight, lint, frontend-package-gates]
    if: >-
      ${{
        always()
        && needs.preflight.result == 'success'
        && needs.preflight.outputs.fast_pass != 'true'
        && needs.lint.result == 'success'
        && (
          needs['frontend-package-gates'].result == 'success'
          || (
            needs.preflight.outputs.frontend_required != 'true'
            && needs['frontend-package-gates'].result == 'skipped'
          )
        )
      }}
    permissions:
      contents: read
    with:
      builder: b
      archive_labels: "3"
      expected_count_suffix: b

  test-slow-shard:
