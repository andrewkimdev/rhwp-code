name: CI

on:
  push:
    branches: [main, devel]
    tags: ['v*']
    paths-ignore:
      - 'mydocs/**'
      - 'docs/**'
      - 'samples/**'
      - 'assets/chrome/**'
      - 'assets/edge/**'
      - 'assets/logo/**'
      - 'assets/screenshots/**'
      - '*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/CODE_OF_CONDUCT.md'
      - '.github/SECURITY.md'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - 'rhwp-logo.*'
  pull_request:
    branches: [main, devel]
    paths-ignore:
      - 'docs/**'
      - 'samples/**'
      - 'assets/chrome/**'
      - 'assets/edge/**'
      - 'assets/logo/**'
      - 'assets/screenshots/**'
      - '*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/CODE_OF_CONDUCT.md'
      - '.github/SECURITY.md'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - 'rhwp-logo.*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# [Task #1192 F] 같은 PR 에 새 push 가 오면 진행 중 run 을 취소해 중복 실행 제거.
# cancel-in-progress 는 PR 이벤트에서만 활성화 — devel/main push 머지 검증 run 은 보존.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: CI preflight
    runs-on: ubuntu-latest
    # [#3284] 러너 hang 을 실패로 드러내는 상한 (성능 목표 아님) — 실험 종료 후에도 유지
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      checks: read
      pull-requests: read
    outputs:
      fast_pass: ${{ steps.detect.outputs.fast_pass || 'false' }}
      reason: ${{ steps.detect.outputs.reason || 'preflight-unavailable' }}
      candidate_sha: ${{ steps.detect.outputs.candidate_sha || '' }}
      frontend_required: ${{ steps.frontend-impact.outputs.frontend_required || 'true' }}
      frontend_reason: ${{ steps.frontend-impact.outputs.frontend_reason || 'frontend-detection-unavailable' }}
      # [#3790 Stage 1] shadow output은 관찰 전용이다. 아래 worker 조건은 아직 이 값을 참조하지 않는다.
      shadow_rust_required: ${{ steps.impact-shadow.outputs.rust_required || 'true' }}
      shadow_frontend_mode: ${{ steps.impact-shadow.outputs.frontend_mode || 'package' }}
      shadow_render_required: ${{ steps.impact-shadow.outputs.render_required || 'true' }}
      shadow_native_skia_required: ${{ steps.impact-shadow.outputs.native_skia_required || 'true' }}
      shadow_codeql_languages: ${{ steps.impact-shadow.outputs.codeql_languages || 'javascript-typescript,python,rust' }}
      shadow_classification_status: ${{ steps.impact-shadow.outputs.classification_status || 'full' }}
      shadow_classifier_version: ${{ steps.impact-shadow.outputs.classifier_version || 'unavailable' }}
      shadow_reason: ${{ steps.impact-shadow.outputs.reason || 'fail-closed:shadow-unavailable' }}
      shadow_authority: ${{ steps.collect-impact-shadow.outputs.authority || 'unavailable-advisory' }}

    steps:
      - name: Detect review-only fast pass
        id: detect
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # [#2804] API 5xx 일시 오류에 job 이 죽지 않도록 재시도한다.
          # retry-exempt-status-codes 기본값(400,401,403,404,422)이 4xx 를 제외하므로 5xx 만 재시도된다.
          retries: 3
          script: |
            const allowedConclusions = new Set(['success', 'skipped', 'neutral']);
            const { owner, repo } = context.repo;

            function setResult(fastPass, reason, candidateSha = '') {
              core.setOutput('fast_pass', fastPass ? 'true' : 'false');
              core.setOutput('reason', reason);
              core.setOutput('candidate_sha', candidateSha);
              core.info(`fast_pass=${fastPass} reason=${reason} candidate_sha=${candidateSha}`);
            }

            function isAllowedReviewPath(file) {
              const filename = file.filename;
              if (filename.startsWith('mydocs/')) {
                return true;
              }
              if (file.status !== 'added') {
                return false;
              }
              return isReviewReferencePath(filename);
            }

            function isReviewReferencePath(filename) {
              return (
                filename.startsWith('samples/')
                && (
                  filename.endsWith('.hwp')
                  || filename.endsWith('.hwpx')
                  || filename.endsWith('.pdf')
                  || filename.endsWith('.png')
                )
              ) || (filename.startsWith('pdf/') && filename.endsWith('.pdf'));
            }

            function reviewOnlyLabel(files) {
              const hasReferenceArtifact = files.some((file) => (
                file.status === 'added'
                && isReviewReferencePath(file.filename)
              ));
              return hasReferenceArtifact ? 'review-reference-only' : 'mydocs-only';
            }

            function isCurrentBaseReviewMerge(commit, baseSha) {
              const parents = commit.parents || [];
              return parents.length === 2 && parents.some((parent) => parent.sha === baseSha);
            }

            async function isCurrentBaseAncestor(candidateSha, baseSha) {
              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${baseSha}...${candidateSha}`,
              });
              return comparison.status === 'ahead' || comparison.status === 'identical';
            }

            function latestRun(runs) {
              return runs
                .slice()
                .sort((a, b) => {
                  const bTime = Date.parse(b.completed_at || b.started_at || b.created_at || 0);
                  const aTime = Date.parse(a.completed_at || a.started_at || a.created_at || 0);
                  return bTime - aTime;
                })[0];
            }

            async function buildResult(candidateSha, pr) {
              const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref: candidateSha,
                per_page: 100,
              });
              let source = 'check-run';
              let buildRun = latestRun(checkRuns.filter((run) => (
                run.name === 'Build & Test'
                && run.app?.slug === 'github-actions'
              )));

              if (!buildRun) {
                // Fork PRs can expose the aggregate only through Actions jobs. Keep the
                // branch and exact candidate SHA identity guard for that fallback.
                const workflowRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner,
                  repo,
                  workflow_id: 'ci.yml',
                  event: 'pull_request',
                  branch: pr.head.ref,
                  per_page: 100,
                });
                const workflowRun = latestRun(workflowRuns.filter((run) => (
                  run.path === '.github/workflows/ci.yml'
                  && run.event === 'pull_request'
                  && run.head_sha === candidateSha
                )));

                if (!workflowRun) {
                  return { state: 'missing', reason: `missing-build-and-test:${candidateSha}` };
                }
                if (workflowRun.status !== 'completed') {
                  return {
                    state: 'pending',
                    reason: `build-and-test-workflow-not-completed:${workflowRun.status}`,
                  };
                }

                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  owner,
                  repo,
                  run_id: workflowRun.id,
                  filter: 'latest',
                  per_page: 100,
                });
                buildRun = latestRun(jobs.filter((job) => job.name === 'Build & Test'));
                if (!buildRun) {
                  return { state: 'missing', reason: `missing-build-and-test-job:${candidateSha}` };
                }
                source = 'actions-job';
              }
              if (buildRun.status !== 'completed') {
                return {
                  state: 'pending',
                  reason: `build-and-test-not-completed:${buildRun.status}`,
                };
              }
              if (!allowedConclusions.has(buildRun.conclusion)) {
                return {
                  state: 'failed',
                  reason: `build-and-test-not-green:${buildRun.conclusion}`,
                };
              }
              return { state: 'green', source, conclusion: buildRun.conclusion };
            }

            try {
              if (context.eventName !== 'pull_request') {
                setResult(false, 'not-pull-request');
                return;
              }

              const pr = context.payload.pull_request;
              const prFiles = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              });
              if (prFiles.length > 0 && prFiles.every((file) => isAllowedReviewPath(file))) {
                core.info(`all PR files are review-only; using base SHA ${pr.base.sha}`);
                setResult(true, 'all-review-only-no-code-impact', pr.base.sha);
                return;
              }

              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              });

              if (commits.length === 0) {
                setResult(false, 'no-pr-commits');
                return;
              }

              const reviewOnlyCandidates = [];
              let codeCandidateSha = '';

              for (let index = commits.length - 1; index >= 0; index -= 1) {
                const sha = commits[index].sha;
                const { data: commit } = await github.rest.repos.getCommit({
                  owner,
                  repo,
                  ref: sha,
                });
                const files = commit.files || [];

                // The commit endpoint may truncate very large file lists. Fall back to full CI.
                if (files.length === 0 || files.length >= 300) {
                  setResult(false, `unusable-file-list:${sha}`);
                  return;
                }

                const reviewOnly = files.every((file) => isAllowedReviewPath(file));
                if (reviewOnly) {
                  const parents = commit.parents || [];
                  if (parents.length === 1) {
                    reviewOnlyCandidates.push(sha);
                    continue;
                  }
                  // #3233: a docs-only Update branch merge can be an eligible green
                  // candidate only after a trailing review-only record. Other merge
                  // shapes may hide code outside the review-only diff.
                  if (reviewOnlyCandidates.length > 0
                    && isCurrentBaseReviewMerge(commit, pr.base.sha)) {
                    reviewOnlyCandidates.push(sha);
                    core.info(`including current-base ${reviewOnlyLabel(files)} merge candidate ${sha}`);
                    break;
                  }
                  setResult(false, `${reviewOnlyLabel(files)}-merge-not-reusable:${sha}`);
                  return;
                }

                codeCandidateSha = sha;
                break;
              }

              if (reviewOnlyCandidates.length === 0) {
                setResult(false, 'no-trailing-review-only-commits');
                return;
              }
              if (codeCandidateSha) {
                reviewOnlyCandidates.push(codeCandidateSha);
              }

              for (const candidateSha of reviewOnlyCandidates) {
                if (!(await isCurrentBaseAncestor(candidateSha, pr.base.sha))) {
                  core.info(`candidate does not include current base: ${candidateSha}`);
                  continue;
                }
                const result = await buildResult(candidateSha, pr);
                if (result.state === 'green') {
                  const successReason = result.source === 'check-run'
                    ? `build-and-test-green:${result.conclusion}`
                    : `build-and-test-job-green:${result.conclusion}`;
                  setResult(true, successReason, candidateSha);
                  return;
                }
                if (result.state === 'failed') {
                  setResult(false, result.reason, candidateSha);
                  return;
                }
                core.info(`candidate not reusable yet: ${candidateSha} (${result.reason})`);
              }

              setResult(false, 'no-green-current-base-build-candidate');
            } catch (error) {
              core.warning(`CI preflight failed; running full CI. ${error.message}`);
              setResult(false, 'preflight-error');
            }

      - name: Detect frontend impact
        id: frontend-impact
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # [#2804] API 5xx 일시 오류에 job 이 죽지 않도록 재시도한다.
          # retry-exempt-status-codes 기본값(400,401,403,404,422)이 4xx 를 제외하므로 5xx 만 재시도된다.
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const directoryPrefixes = [
              'rhwp-studio/',
              'rhwp-chrome/',
              'rhwp-firefox/',
              'rhwp-safari/',
              'rhwp-vscode/',
              'rhwp-shared/',
              'npm/editor/',
              'assets/fonts/',
            ];

            function setResult(required, reason) {
              core.setOutput('frontend_required', required ? 'true' : 'false');
              core.setOutput('frontend_reason', reason);
              core.info(`frontend_required=${required} frontend_reason=${reason}`);
            }

            function isFrontendPath(filename) {
              if (directoryPrefixes.some((prefix) => filename.startsWith(prefix))) {
                return true;
              }
              if (
                filename === 'Cargo.lock'
                || filename === 'src/wasm_api.rs'
                || filename === '.github/workflows/ci.yml'
              ) {
                return true;
              }
              return filename.startsWith('scripts/frontend-') && filename.endsWith('.mjs');
            }

            function evaluateFiles(files) {
              for (const file of files) {
                for (const filename of [file.filename, file.previous_filename]) {
                  if (filename && isFrontendPath(filename)) {
                    setResult(true, `frontend-path:${filename}`);
                    return;
                  }
                }
              }
              setResult(false, 'no-frontend-path');
            }

            try {
              if (context.eventName === 'pull_request') {
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  owner,
                  repo,
                  pull_number: context.payload.pull_request.number,
                  per_page: 100,
                });
                // The API documents at most 3,000 PR files. Treat the boundary as truncated.
                if (files.length === 0 || files.length >= 3000) {
                  setResult(true, 'pr-file-list-empty-or-unusable');
                  return;
                }
                evaluateFiles(files);
                return;
              }

              if (context.eventName === 'push') {
                if (context.ref.startsWith('refs/tags/')) {
                  setResult(true, 'manual-or-tag');
                  return;
                }

                const before = context.payload.before || '';
                const after = context.payload.after || context.sha;
                if (!before || /^0+$/.test(before)) {
                  setResult(true, 'push-zero-before');
                  return;
                }

                const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${before}...${after}`,
                });
                const files = comparison.files || [];
                // Compare exposes at most 300 files. The boundary may be truncated.
                if (files.length === 0 || files.length >= 300) {
                  setResult(true, 'push-file-list-empty-or-unusable');
                  return;
                }
                evaluateFiles(files);
                return;
              }

              if (context.eventName === 'workflow_dispatch') {
                setResult(true, 'manual-or-tag');
                return;
              }

              setResult(true, `unsupported-event:${context.eventName}`);
            } catch (error) {
              core.warning(`Frontend impact detection failed; running frontend gates. ${error.message}`);
              setResult(true, 'detection-error');
            }

      # [#3790 Stage 1] PR checkout의 classifier는 아직 trusted skip 근거가 아니다.
      # 토큰을 전달하지 않는 별도 node step에서 판정하고 summary에만 기록한다.
      - name: Check out repository for advisory impact classifier
        if: ${{ steps.detect.outputs.fast_pass != 'true' }}
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-impact-classifier.cjs
          sparse-checkout-cone-mode: false

      - name: Collect shadow CI impact input
        id: collect-impact-shadow
        if: ${{ steps.detect.outputs.fast_pass != 'true' }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { owner, repo } = context.repo;
            const inputPath = path.join(
              process.env.GITHUB_WORKSPACE || process.cwd(),
              '.ci-impact-input.json',
            );
            const authority = context.eventName === 'pull_request'
              ? 'pr-merge-advisory'
              : 'checked-out-ref-advisory';
            core.setOutput('authority', authority);

            function writeInput(input) {
              fs.writeFileSync(inputPath, `${JSON.stringify(input)}\n`, 'utf8');
              core.info(`shadow impact input: event=${input.eventName} files=${input.files.length}`);
            }

            function normalizedFiles(files) {
              return files.map((file) => ({
                filename: file.filename,
                previous_filename: file.previous_filename || '',
                status: file.status || 'modified',
              }));
            }

            try {
              if (context.eventName === 'pull_request') {
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  owner,
                  repo,
                  pull_number: context.payload.pull_request.number,
                  per_page: 100,
                });
                writeInput({
                  eventName: context.eventName,
                  files: normalizedFiles(files),
                });
                return;
              }

              if (context.eventName === 'push') {
                if (context.ref.startsWith('refs/tags/')) {
                  writeInput({
                    eventName: context.eventName,
                    files: [],
                    forceFullReason: 'manual-or-tag',
                  });
                  return;
                }

                const before = context.payload.before || '';
                const after = context.payload.after || context.sha;
                if (!before || /^0+$/.test(before)) {
                  writeInput({
                    eventName: context.eventName,
                    files: [],
                    forceFullReason: 'push-zero-before',
                  });
                  return;
                }

                const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${before}...${after}`,
                });
                writeInput({
                  eventName: context.eventName,
                  files: normalizedFiles(comparison.files || []),
                });
                return;
              }

              writeInput({
                eventName: context.eventName,
                files: [],
                forceFullReason: context.eventName === 'workflow_dispatch'
                  ? 'manual-or-tag'
                  : 'unsupported-event',
              });
            } catch (error) {
              core.warning(`Shadow impact file collection failed; recording full. ${error.message}`);
              writeInput({
                eventName: context.eventName,
                files: [],
                forceFullReason: 'collection-error',
              });
            }

      - name: Classify CI impact in shadow mode
        id: impact-shadow
        if: ${{ steps.detect.outputs.fast_pass != 'true' }}
        continue-on-error: true
        run: >-
          node scripts/ci-impact-classifier.cjs
          --input .ci-impact-input.json
          --github-output "$GITHUB_OUTPUT"

      - name: Summarize shadow CI impact classification
        if: ${{ always() }}
        continue-on-error: true
        env:
          SHADOW_AUTHORITY: ${{ steps.collect-impact-shadow.outputs.authority || 'unavailable-advisory' }}
          SHADOW_RUST_REQUIRED: ${{ steps.impact-shadow.outputs.rust_required || 'true' }}
          SHADOW_FRONTEND_MODE: ${{ steps.impact-shadow.outputs.frontend_mode || 'package' }}
          SHADOW_RENDER_REQUIRED: ${{ steps.impact-shadow.outputs.render_required || 'true' }}
          SHADOW_NATIVE_SKIA_REQUIRED: ${{ steps.impact-shadow.outputs.native_skia_required || 'true' }}
          SHADOW_CODEQL_LANGUAGES: ${{ steps.impact-shadow.outputs.codeql_languages || 'javascript-typescript,python,rust' }}
          SHADOW_STATUS: ${{ steps.impact-shadow.outputs.classification_status || 'full' }}
          SHADOW_VERSION: ${{ steps.impact-shadow.outputs.classifier_version || 'unavailable' }}
          SHADOW_REASON: ${{ steps.impact-shadow.outputs.reason || 'fail-closed:shadow-unavailable' }}
        run: |
          {
            echo '### Shadow CI impact classification'
            echo
            echo '> Advisory only: existing worker conditions are unchanged in #3790 Stage 1.'
            echo '> Review-only fast-pass skips the advisory classifier checkout.'
            echo
            echo '| Axis | Value |'
            echo '| --- | --- |'
            printf '| authority | %s |\n' "${SHADOW_AUTHORITY}"
            printf '| rust_required | %s |\n' "${SHADOW_RUST_REQUIRED}"
            printf '| frontend_mode | %s |\n' "${SHADOW_FRONTEND_MODE}"
            printf '| render_required | %s |\n' "${SHADOW_RENDER_REQUIRED}"
            printf '| native_skia_required | %s |\n' "${SHADOW_NATIVE_SKIA_REQUIRED}"
            printf '| codeql_languages | %s |\n' "${SHADOW_CODEQL_LANGUAGES}"
            printf '| classification_status | %s |\n' "${SHADOW_STATUS}"
            printf '| classifier_version | %s |\n' "${SHADOW_VERSION}"
            printf '| reason | %s |\n' "${SHADOW_REASON}"
          } >> "${GITHUB_STEP_SUMMARY}"

  # [#2393] 기본 테스트 병렬화 — Cargo test target을 A/B builder로 나눠 별도 compile한다.
  # 각 builder는 자기 target에서 만든 archive만 upload하고, 여덟 test worker는 자신의 archive 하나만
  # 내려받아 실행한다. Native Skia와 builder matrix는 lint/frontend gate 뒤 병렬로 시작한다. Native
  # 실패 시 builder가 끝날 수는 있어도 shard는 두 job 성공 뒤에만 시작하므로 #3064의 실행 차단은 유지한다.
  # required check 는 집계 job "Build & Test" 로 불변이다.
  build-test-archive:
    name: Build test archive (${{ matrix.builder }})
    runs-on: ubuntu-latest
    # [#3284] 러너 hang 을 실패로 드러내는 상한 (성능 목표 아님) — 실험 종료 후에도 유지
    timeout-minutes: 30
    needs: [preflight, lint, frontend-package-gates]
    if: >-
      ${{
        always()
        && needs.preflight.result == 'success'
        && needs.preflight.outputs.fast_pass != 'true'
        && needs.lint.result == 'success'
        && (
          needs['frontend-package-gates'].result == 'success'
          || (
            needs.preflight.outputs.frontend_required != 'true'
            && needs['frontend-package-gates'].result == 'skipped'
          )
        )
      }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          # 일반 archive target 수 차이는 1 이하로 맞추고, A/B의 compile source bytes는 planner가 균형화한다.
          - builder: a
            archive_labels: "slow 1 2 3"
          - builder: b
            archive_labels: "4 5 6 7"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # [Task #1109 / #1192 C] ubuntu-latest runner 의 미사용 사전 설치 toolchain 제거하여
      # 테스트 빌드 시 디스크 한도 초과를 줄인다.
      - name: Free disk space (remove unused pre-installed toolchains)
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          df -h

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 브랜치 (2026-08-01 시점)
        with:
          toolchain: 1.93.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: nextest

      # [#2393] 수동 restore/save 캐시 → rust-cache (적중률·정리 자동화).
      # 저장 정책은 종전과 동일하게 devel/main push 로 한정.
      - name: Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: test-archive
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/devel' || github.ref == 'refs/heads/main') }}

      # [Task #1849] PR/devel push 는 release-test 전체 회귀, main/tag/manual 은 release.
      - name: Select cargo profile
        id: profile
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]] || [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/devel" ]]; then
            echo "cargo_profile=release-test" >> "$GITHUB_OUTPUT"
          else
            echo "cargo_profile=release" >> "$GITHUB_OUTPUT"
          fi

      # [#3888] `cargo nextest list`로 전체 binary를 선빌드하지 않는다. Cargo metadata의 test target을
      # A/B builder와 slow + regular 7개 archive에 독점 배정한다. `--test`/`--lib`/`--bin` selector가
      # archive 생성과 동시에 해당 target만 compile하므로 두 GitHub-hosted runner가 실제 build를 나눈다.
      - name: Build and allocate default-feature test archives
        env:
          BUILDER: ${{ matrix.builder }}
          ARCHIVE_LABELS: ${{ matrix.archive_labels }}
        run: |
          echo "profile=${{ steps.profile.outputs.cargo_profile }} event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF}"
          cargo metadata --format-version 1 --no-deps > cargo-metadata.json
          node .github/scripts/plan_nextest_target_archives.mjs \
            --input cargo-metadata.json \
            --output-dir ci-target-archives \
            --package rhwp \
            --slow-test-target overflow_cell_baseline

          for label in ${ARCHIVE_LABELS}; do
            owner=$(jq -r ".archives[\"${label}\"].builder" ci-target-archives/assignment.json)
            if [[ "$owner" != "$BUILDER" ]]; then
              echo "::error::archive ${label} belongs to builder ${owner}, not ${BUILDER}"
              exit 1
            fi
            mapfile -t target_args < "ci-target-archives/${label}.args"
            if [[ "${#target_args[@]}" == "0" ]]; then
              echo "::error::archive ${label} has no Cargo target selector"
              exit 1
            fi
            archive="tests-${label}.tar.zst"
            cargo nextest archive \
              --package rhwp \
              --cargo-profile "${{ steps.profile.outputs.cargo_profile }}" \
              "${target_args[@]}" \
              --archive-file "$archive"
            stat --printf='archive=%n bytes=%s\n' "$archive"

            cargo nextest list \
              --package rhwp \
              --cargo-profile "${{ steps.profile.outputs.cargo_profile }}" \
              "${target_args[@]}" \
              --message-format json > "nextest-list-${label}.json"
            runnable=$(node .github/scripts/count_nextest_runnable.mjs --input "nextest-list-${label}.json")
            if ! [[ "$runnable" =~ ^[0-9]+$ ]]; then
              echo "::error::archive ${label} runnable count is invalid: ${runnable}"
              exit 1
            fi
            printf '%s\n' "$runnable" > "archive-expected-${label}.txt"
            echo "archive=${label} expected_runnable=${runnable}"
          done

      - name: Upload slow test archive
        if: ${{ matrix.builder == 'a' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-archive-${{ github.run_id }}-slow
          path: tests-slow.tar.zst
          # nextest archive는 이미 압축한 파일이므로 ZIP 재압축 CPU를 쓰지 않는다. (#3266)
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload test archive 1
        if: ${{ matrix.builder == 'a' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-archive-${{ github.run_id }}-1
          path: tests-1.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload test archive 2
        if: ${{ matrix.builder == 'a' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-archive-${{ github.run_id }}-2
          path: tests-2.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload test archive 3
        if: ${{ matrix.builder == 'a' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-archive-${{ github.run_id }}-3
          path: tests-3.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload test archive 4
        if: ${{ matrix.builder == 'b' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-archive-${{ github.run_id }}-4
          path: tests-4.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload test archive 5
        if: ${{ matrix.builder == 'b' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-archive-${{ github.run_id }}-5
          path: tests-5.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload test archive 6
        if: ${{ matrix.builder == 'b' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-archive-${{ github.run_id }}-6
          path: tests-6.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload test archive 7
        if: ${{ matrix.builder == 'b' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-archive-${{ github.run_id }}-7
          path: tests-7.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload archive expected counts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-expected-${{ github.run_id }}-${{ matrix.builder }}
          path: archive-expected-*.txt
          retention-days: 1
          if-no-files-found: error

  test-shard:
    name: Default-feature tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    # [#3284] 러너 hang 을 실패로 드러내는 상한 (성능 목표 아님) — 실험 종료 후에도 유지
    timeout-minutes: 30
    needs: [preflight, native-skia-tests, build-test-archive]
    # [#3266] archive와 Native Skia를 병렬화하되, 두 필수 worker가 모두 성공한
    # 뒤에만 기본 테스트를 실행한다. 따라서 Native 실패 시 archive가 완료돼도 shard는 skip된다.
    if: >-
      ${{
        always()
        && needs.preflight.result == 'success'
        && needs.preflight.outputs.fast_pass != 'true'
        && needs['native-skia-tests'].result == 'success'
        && needs['build-test-archive'].result == 'success'
      }}
    permissions:
      contents: read
    strategy:
      # [#3888] slow worker 1개와 일반 worker 7개를 같은 matrix로 유지해, 하나가 실패하면
      # 나머지 일곱 worker도 즉시 취소한다. 총 러너 수는 기존과 같이 8개다.
      fail-fast: true
      matrix:
        include:
          - label: slow shard
            count_label: slow
            archive_label: slow
          - label: shard 1/7
            count_label: 1
            archive_label: 1
          - label: shard 2/7
            count_label: 2
            archive_label: 2
          - label: shard 3/7
            count_label: 3
            archive_label: 3
          - label: shard 4/7
            count_label: 4
            archive_label: 4
          - label: shard 5/7
            count_label: 5
            archive_label: 5
          - label: shard 6/7
            count_label: 6
            archive_label: 6
          - label: shard 7/7
            count_label: 7
            archive_label: 7

    steps:
      # 테스트가 samples/ pdf/ 등 저장소 픽스처를 읽으므로 checkout 필요.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 브랜치 (2026-08-01 시점)
        with:
          toolchain: 1.93.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: nextest

      - name: Download test archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-archive-${{ github.run_id }}-${{ matrix.archive_label }}

      # [#2393] 공허 통과 방지: Summary의 run을 shard별 artifact로 남긴다.
      # 집계 job이 8개 archive shard의 합계 = 전체 runnable 테스트 수를 대조한다.
      - name: Run ${{ matrix.label }}
        env:
          COUNT_LABEL: ${{ matrix.count_label }}
        run: |
          set -o pipefail
          # --extract-to . : CLI 테스트의 env!("CARGO_BIN_EXE_rhwp") 는 빌드
          # 러너 절대 경로가 컴파일 타임에 박힌다. GitHub 러너는 job 간
          # workspace 경로가 동일하므로 워크스페이스에 풀어 target/ 경로를
          # 그대로 복원한다 (임시 디렉터리 추출 시 NotFound — PR CI 실측).
          cargo nextest run \
            --archive-file "tests-${COUNT_LABEL}.tar.zst" \
            --workspace-remap . \
            --extract-to . \
            2>&1 | tee nextest-shard.log
          # CARGO_TERM_COLOR=always 로 Summary 라인에 ANSI 색코드가 섞이므로
          # 스트립 후 파싱한다 (2차 PR CI 실측 — 376 run green 인데 파싱 실패).
          summary=$(sed 's/\x1b\[[0-9;]*m//g' nextest-shard.log | grep -E "Summary \[" | tail -1)
          # slow shard는 정확히 한 테스트를 실행하므로 nextest의 단수형 `1 test run`도 수용한다.
          run=$(echo "$summary" | grep -oE "[0-9]+ tests? run" | grep -oE "^[0-9]+")
          if [[ -z "$run" ]]; then
            echo "::error::shard summary parse failed"; exit 1
          fi
          echo "$run" > "shard-count-${COUNT_LABEL}.txt"
          cat "shard-count-${COUNT_LABEL}.txt"

      - name: Upload ${{ matrix.label }} count
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shard-count-${{ matrix.count_label }}
          path: shard-count-${{ matrix.count_label }}.txt
          retention-days: 1
          if-no-files-found: error

  lint:
    name: Lint (fmt, clippy, WASM check)
    runs-on: ubuntu-latest
    # [#3284] 러너 hang 을 실패로 드러내는 상한 (성능 목표 아님) — 실험 종료 후에도 유지
    timeout-minutes: 20
    needs: preflight
    if: ${{ always() && needs.preflight.outputs.fast_pass != 'true' }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 브랜치 (2026-08-01 시점)
        with:
          toolchain: 1.93.1
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: lint
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/devel' || github.ref == 'refs/heads/main') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Validate CI impact classifier
        run: |
          node --test scripts/tests/ci-impact-classifier.test.cjs
          python3 -m unittest scripts/tests/test_ci_impact_workflow.py

      - name: Validate Render Diff trigger policy
        run: python3 -m unittest scripts/tests/test_render_diff_workflow.py

      - name: Clippy
        run: cargo clippy -- -D warnings

      # [#3664] Native FFI 크레이트가 워크스페이스 밖이라 어느 CI job 도 건드리지
      # 않는 사이 코어 API 변경을 못 따라가 이미 컴파일이 깨져 있었다(C#·Swift 래퍼
      # 동반 무력화). 기본 `cargo clippy` 는 루트 크레이트만 보므로 별도 검사가 필요하다.
      #
      # [#3890] 종전에는 `-p rhwp-native-ffi` 로 좁혔다 — `rhwp-subsecond` 가 feature
      # 게이트 불일치로 `--workspace` 를 상시 깨뜨렸기 때문이다. 그 결함을 고쳐
      # **워크스페이스 전체**로 넓힌다. 앞으로 추가되는 멤버가 자동으로 검사 대상이
      # 되며, 깨진 채 들어오면 여기서 막힌다(그것이 이 가드의 목적이다).
      - name: Check workspace members (FFI bindings, tools)
        run: |
          cargo build --workspace
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Check WASM target
        run: cargo check --target wasm32-unknown-unknown --lib

  native-skia-tests:
    name: Native Skia tests
    runs-on: ubuntu-latest
    # [#3284] 러너 hang 을 실패로 드러내는 상한 (성능 목표 아님) — 실험 종료 후에도 유지
    timeout-minutes: 30
    needs: [preflight, lint, frontend-package-gates]
    # frontend 비대상 job의 skipped는 정상 경로다. 대상 job의 실패/취소와 lint 실패는
    # native-skia 이후 worker 전체에 전파한다.
    if: >-
      ${{
        always()
        && needs.preflight.result == 'success'
        && needs.preflight.outputs.fast_pass != 'true'
        && needs.lint.result == 'success'
        && (
          needs['frontend-package-gates'].result == 'success'
          || (
            needs.preflight.outputs.frontend_required != 'true'
            && needs['frontend-package-gates'].result == 'skipped'
          )
        )
      }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # [Task #1109 / #1192 C] ubuntu-latest runner 의 미사용 사전 설치 toolchain 제거하여
      # 테스트 빌드 시 디스크 한도 초과를 줄인다.
      # [#1192] 캐시 정상 작동 확인 후 "크고 빠른" 항목(android/dotnet)만 남기고 축소.
      # 느린 docker prune --all / apt clean / ghc / CodeQL 정리는 제거. df -h 로 여유 확인.
      - name: Free disk space (remove unused pre-installed toolchains)
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          df -h

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 브랜치 (2026-08-01 시점)
        with:
          toolchain: 1.93.1

      # [#2431 C] 기본 test job 의 rust-cache 이행 후 writer가 사라진
      # Linux-cargo-* namespace 대신 Native Skia 전용 shared key를 사용한다.
      # PR은 restore-only, devel/main push만 save하는 신뢰 경계를 유지한다.
      - name: Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: native-skia
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/devel' || github.ref == 'refs/heads/main') }}

      - name: Install native Skia runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-dejavu-core \
            libfontconfig1-dev \
            libfreetype6-dev

      - name: Native Skia tests
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]] || [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/devel" ]]; then
            echo "profile=release-test event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF}"
            cargo test --profile release-test --features native-skia skia --lib --verbose
            cargo test --profile release-test --features native-skia --test issue_2225_missing_picture_placeholder --verbose
            cargo test --profile release-test --features native-skia --test render_p37_direct_pdf_export --verbose
          else
            echo "profile=release event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF}"
            cargo test --release --features native-skia skia --lib --verbose
            cargo test --release --features native-skia --test issue_2225_missing_picture_placeholder --verbose
            cargo test --release --features native-skia --test render_p37_direct_pdf_export --verbose
          fi

  frontend-package-gates:
    name: Frontend package gates
    runs-on: ubuntu-latest
    # [#3284] 러너 hang 을 실패로 드러내는 상한 (성능 목표 아님) — 실험 종료 후에도 유지
    timeout-minutes: 20
    # [#3268] Frontend는 Lint의 산출물을 읽지 않고 독립 runner에서 별도 target/cache를 쓴다.
    # preflight의 fast-pass·영향 판정만 기다려 Lint와 병렬 시작한다. Lint 실패 시 Frontend가
    # 끝날 수는 있지만 Native/archive는 아래 두 worker의 성공을 모두 계속 요구한다.
    needs: preflight
    if: ${{ always() && needs.preflight.result == 'success' && needs.preflight.outputs.fast_pass != 'true' && needs.preflight.outputs.frontend_required == 'true' }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 브랜치 (2026-08-01 시점)
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - name: Restore frontend WASM cargo cache
        id: frontend_wasm_cargo_cache_restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-frontend-wasm-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-frontend-wasm-cargo-

      - name: Build fresh WASM package for frontend gates
        run: wasm-pack build --target web --dev

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            rhwp-studio/package-lock.json
            rhwp-chrome/package-lock.json
            rhwp-firefox/package-lock.json
            rhwp-vscode/package-lock.json

      - name: Install frontend package dependencies
        run: |
          npm --prefix rhwp-studio ci
          npm --prefix rhwp-chrome ci
          npm --prefix rhwp-firefox ci
          npm --prefix rhwp-vscode ci

      - name: Verify WASM bindings and editor embed contract
        run: node --test scripts/frontend-wasm-bindings.test.mjs scripts/frontend-editor-embed.test.mjs

      - name: Run editor package tests when declared
        run: npm --prefix npm/editor test --if-present

      - name: Run shared and extension service worker tests
        run: node --test rhwp-shared/sw/*.test.js rhwp-chrome/sw/*.test.mjs rhwp-firefox/sw/*.test.mjs

      - name: Run Chrome extension options UI tests
        run: node --test rhwp-chrome/options.test.mjs

      - name: Run Studio unit tests
        run: npm --prefix rhwp-studio run test

      - name: Build Studio
        run: npm --prefix rhwp-studio run build

      - name: Build browser extensions
        run: |
          npm --prefix rhwp-chrome run build
          npm --prefix rhwp-firefox run build

      - name: Verify extension distributions
        run: node --test scripts/frontend-extension-dist.test.mjs

      - name: Compile VS Code extension
        run: npm --prefix rhwp-vscode run compile

      - name: Verify font asset contracts
        run: node --test scripts/frontend-font-assets.test.mjs

      - name: Save frontend WASM cargo cache
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/devel' || github.ref == 'refs/heads/main') && steps.frontend_wasm_cargo_cache_restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-frontend-wasm-cargo-${{ hashFiles('**/Cargo.lock') }}

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    # [#3284] 러너 hang 을 실패로 드러내는 상한 (성능 목표 아님) — 실험 종료 후에도 유지
    timeout-minutes: 45
    needs:
      - preflight
      - build-test-archive
      - test-shard
      - lint
      - native-skia-tests
      - frontend-package-gates
    if: ${{ always() }}
    permissions:
      contents: read

    steps:
      # [#2393] 샤드 합계 대조 — archive 생성 시 실제 target selector로 얻은 runnable 수와
      # 여덟 worker의 Summary run 합계가 일치해야 한다 (fast-pass 시 샤드 미실행이라 생략).
      - name: Download shard counts
        if: ${{ needs.preflight.outputs.fast_pass != 'true' && needs['test-shard'].result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: shard-count-*
          merge-multiple: true

      - name: Download archive expected counts
        if: ${{ needs.preflight.outputs.fast_pass != 'true' && needs['test-shard'].result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-expected-*
          merge-multiple: true

      - name: Verify shard totals
        if: ${{ needs.preflight.outputs.fast_pass != 'true' && needs['test-shard'].result == 'success' }}
        run: |
          shards=$(find . -maxdepth 1 -type f -name 'shard-count-*.txt' | wc -l | tr -d ' ')
          if [[ "$shards" != "8" ]]; then
            echo "::error::expected 8 shard count files, found ${shards}"
            exit 1
          fi
          expected_files=$(find . -maxdepth 1 -type f -name 'archive-expected-*.txt' | wc -l | tr -d ' ')
          if [[ "$expected_files" != "8" ]]; then
            echo "::error::expected 8 archive expected count files, found ${expected_files}"
            exit 1
          fi
          expected=0
          for f in archive-expected-*.txt; do
            read -r run < "$f"
            if ! [[ "$run" =~ ^[0-9]+$ ]]; then
              echo "::error::invalid archive expected count in ${f}: ${run}"
              exit 1
            fi
            expected=$((expected + run))
            echo "${f}: expected=${run}"
          done
          sum=0
          for f in shard-count-*.txt; do
            read -r run < "$f"
            if ! [[ "$run" =~ ^[0-9]+$ ]]; then
              echo "::error::invalid shard run count in ${f}: ${run}"
              exit 1
            fi
            sum=$((sum + run))
            echo "${f}: run=${run}"
          done
          echo "sum(run)=${sum} expected runnable=${expected}"
          if [[ "$sum" != "${expected}" ]]; then
            echo "::error::shard run sum ${sum} != runnable tests ${expected} (누락 또는 중복)"
            exit 1
          fi

      - name: Check Build & Test worker results
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          FAST_PASS: ${{ needs.preflight.outputs.fast_pass }}
          FRONTEND_REQUIRED: ${{ needs.preflight.outputs.frontend_required }}
          FRONTEND_REASON: ${{ needs.preflight.outputs.frontend_reason }}
          BUILD_ARCHIVE_RESULT: ${{ needs['build-test-archive'].result }}
          TEST_SHARD_RESULT: ${{ needs['test-shard'].result }}
          LINT_RESULT: ${{ needs['lint'].result }}
          NATIVE_SKIA_RESULT: ${{ needs['native-skia-tests'].result }}
          FRONTEND_RESULT: ${{ needs['frontend-package-gates'].result }}
        run: |
          printf 'preflight=%s\n' "${PREFLIGHT_RESULT}"
          printf 'fast_pass=%s\n' "${FAST_PASS}"
          printf 'frontend_required=%s\n' "${FRONTEND_REQUIRED}"
          printf 'frontend_reason=%s\n' "${FRONTEND_REASON}"
          printf 'build_archive=%s\n' "${BUILD_ARCHIVE_RESULT}"
          printf 'test_shard=%s\n' "${TEST_SHARD_RESULT}"
          printf 'lint=%s\n' "${LINT_RESULT}"
          printf 'native_skia=%s\n' "${NATIVE_SKIA_RESULT}"
          printf 'frontend=%s\n' "${FRONTEND_RESULT}"

          if [[ "${PREFLIGHT_RESULT}" != "success" ]]; then
            echo "::error::CI preflight did not succeed: ${PREFLIGHT_RESULT}"
            exit 1
          fi

          if [[ "${FAST_PASS}" == "true" ]]; then
            echo "CI preflight fast-pass accepted."
            exit 0
          fi

          failed=0
          if [[ "${BUILD_ARCHIVE_RESULT}" != "success" ]]; then
            echo "::error::Build test archive result: ${BUILD_ARCHIVE_RESULT}"
            failed=1
          fi
          if [[ "${TEST_SHARD_RESULT}" != "success" ]]; then
            echo "::error::Default-feature test shards result: ${TEST_SHARD_RESULT}"
            failed=1
          fi
          if [[ "${LINT_RESULT}" != "success" ]]; then
            echo "::error::Lint result: ${LINT_RESULT}"
            failed=1
          fi
          if [[ "${NATIVE_SKIA_RESULT}" != "success" ]]; then
            echo "::error::Native Skia tests result: ${NATIVE_SKIA_RESULT}"
            failed=1
          fi
          if [[ "${FRONTEND_REQUIRED}" == "false" ]]; then
            if [[ "${FRONTEND_RESULT}" != "skipped" ]]; then
              echo "::error::Frontend gates should be skipped, got: ${FRONTEND_RESULT}"
              failed=1
            fi
          elif [[ "${FRONTEND_RESULT}" != "success" ]]; then
            echo "::error::Frontend package gates result: ${FRONTEND_RESULT}"
            failed=1
          fi
          exit "${failed}"

  wasm-build:
    name: WASM Build
    runs-on: ubuntu-latest
    # [#3284] 러너 hang 을 실패로 드러내는 상한 (성능 목표 아님) — 실험 종료 후에도 유지
    timeout-minutes: 30
    permissions:
      contents: read
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # [Task #1109 / #1192 C] wasm-build job 도 build-and-test 와 동일 축소 패턴.
      # "크고 빠른" 항목(android/dotnet)만 제거. df -h 로 여유 확인.
      - name: Free disk space (remove unused pre-installed toolchains)
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          df -h

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 브랜치 (2026-08-01 시점)
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-

      - name: Build WASM
        run: wasm-pack build --target web --release

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rhwp-wasm-pkg
          path: pkg/
          retention-days: 30
