  lint:
    name: Lint (fmt, clippy, WASM check)
    runs-on: ubuntu-latest
    # [#3284] 러너 hang 을 실패로 드러내는 상한 (성능 목표 아님) — 실험 종료 후에도 유지
    timeout-minutes: 20
    needs: preflight
    if: ${{ always() && needs.preflight.outputs.fast_pass != 'true' }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 브랜치 (2026-08-01 시점)
        with:
          toolchain: 1.93.1
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: lint
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/devel' || github.ref == 'refs/heads/main') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Validate CI impact classifier
        run: |
          node --test scripts/tests/ci-impact-classifier.test.cjs
          python3 -m unittest scripts/tests/test_ci_impact_workflow.py

      - name: Validate Render Diff trigger policy
        run: python3 -m unittest scripts/tests/test_render_diff_workflow.py

      - name: Clippy
        run: cargo clippy -- -D warnings

      # [#3664] Native FFI 크레이트가 워크스페이스 밖이라 어느 CI job 도 건드리지
      # 않는 사이 코어 API 변경을 못 따라가 이미 컴파일이 깨져 있었다(C#·Swift 래퍼
      # 동반 무력화). 기본 `cargo clippy` 는 루트 크레이트만 보므로 별도 검사가 필요하다.
      #
      # [#3890] 종전에는 `-p rhwp-native-ffi` 로 좁혔다 — `rhwp-subsecond` 가 feature
      # 게이트 불일치로 `--workspace` 를 상시 깨뜨렸기 때문이다. 그 결함을 고쳐
      # **워크스페이스 전체**로 넓힌다. 앞으로 추가되는 멤버가 자동으로 검사 대상이
      # 되며, 깨진 채 들어오면 여기서 막힌다(그것이 이 가드의 목적이다).
      - name: Check workspace members (FFI bindings, tools)
        run: |
          cargo build --workspace
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Check WASM target
        run: cargo check --target wasm32-unknown-unknown --lib

  native-skia-tests:
    name: Native Skia tests
    runs-on: ubuntu-latest
    # [#3284] 러너 hang 을 실패로 드러내는 상한 (성능 목표 아님) — 실험 종료 후에도 유지
    timeout-minutes: 30
    needs: [preflight, lint, frontend-package-gates]
    # frontend 비대상 job의 skipped는 정상 경로다. 대상 job의 실패/취소와 lint 실패는
    # native-skia 이후 worker 전체에 전파한다.
    if: >-
      ${{
        always()
        && needs.preflight.result == 'success'
        && needs.preflight.outputs.fast_pass != 'true'
        && needs.lint.result == 'success'
        && (
          needs['frontend-package-gates'].result == 'success'
          || (
            needs.preflight.outputs.frontend_required != 'true'
            && needs['frontend-package-gates'].result == 'skipped'
          )
        )
      }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # [Task #1109 / #1192 C] ubuntu-latest runner 의 미사용 사전 설치 toolchain 제거하여
      # 테스트 빌드 시 디스크 한도 초과를 줄인다.
      # [#1192] 캐시 정상 작동 확인 후 "크고 빠른" 항목(android/dotnet)만 남기고 축소.
      # 느린 docker prune --all / apt clean / ghc / CodeQL 정리는 제거. df -h 로 여유 확인.
      - name: Free disk space (remove unused pre-installed toolchains)
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          df -h

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 브랜치 (2026-08-01 시점)
        with:
          toolchain: 1.93.1

      # [#2431 C] 기본 test job 의 rust-cache 이행 후 writer가 사라진
      # Linux-cargo-* namespace 대신 Native Skia 전용 shared key를 사용한다.
      # PR은 restore-only, devel/main push만 save하는 신뢰 경계를 유지한다.
      - name: Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: native-skia
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/devel' || github.ref == 'refs/heads/main') }}

      - name: Install native Skia runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-dejavu-core \
            libfontconfig1-dev \
            libfreetype6-dev

      - name: Native Skia tests
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]] || [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/devel" ]]; then
            echo "profile=release-test event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF}"
            cargo test --profile release-test --features native-skia skia --lib --verbose
            cargo test --profile release-test --features native-skia --test issue_2225_missing_picture_placeholder --verbose
            cargo test --profile release-test --features native-skia --test render_p37_direct_pdf_export --verbose
          else
            echo "profile=release event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF}"
            cargo test --release --features native-skia skia --lib --verbose
            cargo test --release --features native-skia --test issue_2225_missing_picture_placeholder --verbose
            cargo test --release --features native-skia --test render_p37_direct_pdf_export --verbose
          fi

  frontend-package-gates:
    name: Frontend package gates
    runs-on: ubuntu-latest
    # [#3284] 러너 hang 을 실패로 드러내는 상한 (성능 목표 아님) — 실험 종료 후에도 유지
    timeout-minutes: 20
    # [#3268] Frontend는 Lint의 산출물을 읽지 않고 독립 runner에서 별도 target/cache를 쓴다.
    # preflight의 fast-pass·영향 판정만 기다려 Lint와 병렬 시작한다. Lint 실패 시 Frontend가
    # 끝날 수는 있지만 Native/archive는 아래 두 worker의 성공을 모두 계속 요구한다.
    needs: preflight
    if: ${{ always() && needs.preflight.result == 'success' && needs.preflight.outputs.fast_pass != 'true' && needs.preflight.outputs.frontend_required == 'true' }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 브랜치 (2026-08-01 시점)
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - name: Restore frontend WASM cargo cache
        id: frontend_wasm_cargo_cache_restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-frontend-wasm-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-frontend-wasm-cargo-

      - name: Build fresh WASM package for frontend gates
        run: wasm-pack build --target web --dev

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            rhwp-studio/package-lock.json
            rhwp-chrome/package-lock.json
            rhwp-firefox/package-lock.json
            rhwp-vscode/package-lock.json

      - name: Install frontend package dependencies
        run: |
          npm --prefix rhwp-studio ci
          npm --prefix rhwp-chrome ci
          npm --prefix rhwp-firefox ci
          npm --prefix rhwp-vscode ci

      - name: Verify WASM bindings and editor embed contract
        run: node --test scripts/frontend-wasm-bindings.test.mjs scripts/frontend-editor-embed.test.mjs

      - name: Run editor package tests when declared
        run: npm --prefix npm/editor test --if-present

      - name: Run shared and extension service worker tests
        run: node --test rhwp-shared/sw/*.test.js rhwp-chrome/sw/*.test.mjs rhwp-firefox/sw/*.test.mjs

      - name: Run Chrome extension options UI tests
        run: node --test rhwp-chrome/options.test.mjs

      - name: Run Studio unit tests
        run: npm --prefix rhwp-studio run test

      - name: Build Studio
        run: npm --prefix rhwp-studio run build

      - name: Build browser extensions
        run: |
          npm --prefix rhwp-chrome run build
          npm --prefix rhwp-firefox run build

      - name: Verify extension distributions
        run: node --test scripts/frontend-extension-dist.test.mjs

      - name: Compile VS Code extension
        run: npm --prefix rhwp-vscode run compile

      - name: Verify font asset contracts
        run: node --test scripts/frontend-font-assets.test.mjs

      - name: Save frontend WASM cargo cache
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/devel' || github.ref == 'refs/heads/main') && steps.frontend_wasm_cargo_cache_restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-frontend-wasm-cargo-${{ hashFiles('**/Cargo.lock') }}

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    # [#3284] 러너 hang 을 실패로 드러내는 상한 (성능 목표 아님) — 실험 종료 후에도 유지
    timeout-minutes: 45
    needs:
      - preflight
      - build-test-archive-slow
      - build-test-archive-a
      - build-test-archive-b
      - test-slow-shard
      - test-regular-shard-1
      - test-regular-shard-2
      - test-regular-shard-3
      - lint
      - native-skia-tests
      - frontend-package-gates
    if: ${{ always() }}
    permissions:
      contents: read

    steps:
      # [#2393] 네 archive의 target selector별 runnable 수와 네 worker Summary run 합계가
      # 일치해야 한다 (fast-pass 시 worker 미실행이라 생략).
      - name: Download shard counts
        if: >-
          ${{
            needs.preflight.outputs.fast_pass != 'true'
            && needs['test-slow-shard'].result == 'success'
            && needs['test-regular-shard-1'].result == 'success'
            && needs['test-regular-shard-2'].result == 'success'
            && needs['test-regular-shard-3'].result == 'success'
          }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: shard-count-*
          merge-multiple: true

      - name: Download archive expected counts
        if: >-
          ${{
            needs.preflight.outputs.fast_pass != 'true'
            && needs['test-slow-shard'].result == 'success'
            && needs['test-regular-shard-1'].result == 'success'
            && needs['test-regular-shard-2'].result == 'success'
            && needs['test-regular-shard-3'].result == 'success'
          }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-expected-*
          merge-multiple: true

      - name: Verify shard totals
        if: >-
          ${{
            needs.preflight.outputs.fast_pass != 'true'
            && needs['test-slow-shard'].result == 'success'
            && needs['test-regular-shard-1'].result == 'success'
            && needs['test-regular-shard-2'].result == 'success'
            && needs['test-regular-shard-3'].result == 'success'
          }}
        run: |
          shards=$(find . -maxdepth 1 -type f -name 'shard-count-*.txt' | wc -l | tr -d ' ')
          if [[ "$shards" != "4" ]]; then
            echo "::error::expected 4 shard count files, found ${shards}"
            exit 1
          fi
          expected_files=$(find . -maxdepth 1 -type f -name 'archive-expected-*.txt' | wc -l | tr -d ' ')
          if [[ "$expected_files" != "4" ]]; then
            echo "::error::expected 4 archive expected count files, found ${expected_files}"
            exit 1
          fi
          expected=0
          for f in archive-expected-*.txt; do
            read -r run < "$f"
            if ! [[ "$run" =~ ^[0-9]+$ ]]; then
              echo "::error::invalid archive expected count in ${f}: ${run}"
              exit 1
            fi
            expected=$((expected + run))
            echo "${f}: expected=${run}"
          done
          sum=0
          for f in shard-count-*.txt; do
            read -r run < "$f"
            if ! [[ "$run" =~ ^[0-9]+$ ]]; then
              echo "::error::invalid shard run count in ${f}: ${run}"
              exit 1
            fi
            sum=$((sum + run))
            echo "${f}: run=${run}"
          done
          echo "sum(run)=${sum} expected runnable=${expected}"
          if [[ "$sum" != "${expected}" ]]; then
            echo "::error::shard run sum ${sum} != runnable tests ${expected} (누락 또는 중복)"
            exit 1
          fi

      - name: Check Build & Test worker results
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          FAST_PASS: ${{ needs.preflight.outputs.fast_pass }}
          FRONTEND_REQUIRED: ${{ needs.preflight.outputs.frontend_required }}
          FRONTEND_REASON: ${{ needs.preflight.outputs.frontend_reason }}
          BUILD_SLOW_RESULT: ${{ needs['build-test-archive-slow'].result }}
          BUILD_A_RESULT: ${{ needs['build-test-archive-a'].result }}
          BUILD_B_RESULT: ${{ needs['build-test-archive-b'].result }}
          TEST_SLOW_RESULT: ${{ needs['test-slow-shard'].result }}
          TEST_REGULAR_1_RESULT: ${{ needs['test-regular-shard-1'].result }}
          TEST_REGULAR_2_RESULT: ${{ needs['test-regular-shard-2'].result }}
          TEST_REGULAR_3_RESULT: ${{ needs['test-regular-shard-3'].result }}
          LINT_RESULT: ${{ needs['lint'].result }}
          NATIVE_SKIA_RESULT: ${{ needs['native-skia-tests'].result }}
          FRONTEND_RESULT: ${{ needs['frontend-package-gates'].result }}
        run: |
          printf 'preflight=%s\n' "${PREFLIGHT_RESULT}"
          printf 'fast_pass=%s\n' "${FAST_PASS}"
          printf 'frontend_required=%s\n' "${FRONTEND_REQUIRED}"
          printf 'frontend_reason=%s\n' "${FRONTEND_REASON}"
          printf 'build_slow=%s\n' "${BUILD_SLOW_RESULT}"
          printf 'build_a=%s\n' "${BUILD_A_RESULT}"
          printf 'build_b=%s\n' "${BUILD_B_RESULT}"
          printf 'test_slow=%s\n' "${TEST_SLOW_RESULT}"
          printf 'test_regular_1=%s\n' "${TEST_REGULAR_1_RESULT}"
          printf 'test_regular_2=%s\n' "${TEST_REGULAR_2_RESULT}"
          printf 'test_regular_3=%s\n' "${TEST_REGULAR_3_RESULT}"
          printf 'lint=%s\n' "${LINT_RESULT}"
          printf 'native_skia=%s\n' "${NATIVE_SKIA_RESULT}"
          printf 'frontend=%s\n' "${FRONTEND_RESULT}"

          if [[ "${PREFLIGHT_RESULT}" != "success" ]]; then
            echo "::error::CI preflight did not succeed: ${PREFLIGHT_RESULT}"
            exit 1
          fi

          if [[ "${FAST_PASS}" == "true" ]]; then
            echo "CI preflight fast-pass accepted."
            exit 0
          fi

          failed=0
          if [[ "${BUILD_SLOW_RESULT}" != "success" ]]; then
            echo "::error::Build slow/2 test archives result: ${BUILD_SLOW_RESULT}"
            failed=1
          fi
          if [[ "${BUILD_A_RESULT}" != "success" ]]; then
            echo "::error::Build regular test archive 1 result: ${BUILD_A_RESULT}"
            failed=1
          fi
          if [[ "${BUILD_B_RESULT}" != "success" ]]; then
            echo "::error::Build regular test archive 3 result: ${BUILD_B_RESULT}"
            failed=1
          fi
          if [[ "${TEST_SLOW_RESULT}" != "success" ]]; then
            echo "::error::Default-feature slow shard result: ${TEST_SLOW_RESULT}"
            failed=1
          fi
          if [[ "${TEST_REGULAR_1_RESULT}" != "success" ]]; then
            echo "::error::Default-feature regular shard 1/3 result: ${TEST_REGULAR_1_RESULT}"
            failed=1
          fi
          if [[ "${TEST_REGULAR_2_RESULT}" != "success" ]]; then
            echo "::error::Default-feature regular shard 2/3 result: ${TEST_REGULAR_2_RESULT}"
            failed=1
          fi
          if [[ "${TEST_REGULAR_3_RESULT}" != "success" ]]; then
            echo "::error::Default-feature regular shard 3/3 result: ${TEST_REGULAR_3_RESULT}"
            failed=1
          fi
          if [[ "${LINT_RESULT}" != "success" ]]; then
            echo "::error::Lint result: ${LINT_RESULT}"
            failed=1
          fi
          if [[ "${NATIVE_SKIA_RESULT}" != "success" ]]; then
            echo "::error::Native Skia tests result: ${NATIVE_SKIA_RESULT}"
            failed=1
          fi
          if [[ "${FRONTEND_REQUIRED}" == "false" ]]; then
            if [[ "${FRONTEND_RESULT}" != "skipped" ]]; then
              echo "::error::Frontend gates should be skipped, got: ${FRONTEND_RESULT}"
              failed=1
            fi
          elif [[ "${FRONTEND_RESULT}" != "success" ]]; then
            echo "::error::Frontend package gates result: ${FRONTEND_RESULT}"
            failed=1
          fi
          exit "${failed}"

  wasm-build:
    name: WASM Build
    runs-on: ubuntu-latest
    # [#3284] 러너 hang 을 실패로 드러내는 상한 (성능 목표 아님) — 실험 종료 후에도 유지
    timeout-minutes: 30
    permissions:
      contents: read
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # [Task #1109 / #1192 C] wasm-build job 도 build-and-test 와 동일 축소 패턴.
      # "크고 빠른" 항목(android/dotnet)만 제거. df -h 로 여유 확인.
      - name: Free disk space (remove unused pre-installed toolchains)
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          df -h

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 브랜치 (2026-08-01 시점)
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-

      - name: Build WASM
        run: wasm-pack build --target web --release

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rhwp-wasm-pkg
          path: pkg/
          retention-days: 30
